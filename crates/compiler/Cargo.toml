[package]
name = "sims-compiler"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "In-memory x86 to WebAssembly compiler"

[lib]
crate-type = ["rlib", "cdylib"]

[[test]]
name = "compile"
path = "tests/integration/compile.rs"

[features]
default = []
browser = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.129", optional = true }
wasmparser = "0.240"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
wasm-encoder = "0.240"
object = { version = "0.37", default-features = false, features = ["read_core", "pe", "unaligned"] }

[lints]
workspace = true
