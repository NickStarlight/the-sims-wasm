[package]
name = "sims-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Process-owned guest memory and Windows compatibility services"

[lib]
crate-type = ["rlib", "cdylib"]

[[test]]
name = "process"
path = "tests/integration/process.rs"

[features]
default = []
browser = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
object = { version = "0.37", default-features = false, features = ["read_core", "pe", "unaligned"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libm = "0.2"
unicode-normalization = "0.1"
wasm-bindgen = { version = "=0.2.129", optional = true }
js-sys = { version = "=0.3.106", optional = true }
base64 = "0.23.1"
crc32fast = "1.5.3"
time = { version = "0.3.55", default-features = false }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "id3v2"] }

[lints]
workspace = true
